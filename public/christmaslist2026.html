<!DOCTYPE html>
<html lang="en">

<head>
    <link href="christmaslist2026.css" rel="stylesheet" />
</head>

<body class="christmaslist">
    <div style="background-color:#ffffffdd;border-radius:32px; margin-bottom:1vh">

        <h1>Nathan Cobb Christmas List</h1>
    </div>
    <div
        style="background-color:#ffffffdd; min-height: 80vh; width:80vw; border-radius: 32px; padding: 32px;  gap: 20px; display:grid;grid-auto-columns:minmax(0,1fr); grid-auto-flow:column">
        <div style="display:grid; gap: 10px">
            <div class="card">
                <div>
                    <div>
                        <h4>Harrow Statue</h4>
                        <a href="https://store.warframe.com/collections/featured/products/harrow-collectors-statue">
                            link </a>
                        <p>
                            Just a cool statue of a really cool character from my favorite game
                        </p>
                    </div>
                    <img
                        src="https://store.warframe.com/cdn/shop/products/HarrowStatue_StoreProductImage_Statue_Pin_DigitalBonus_1800x1800.png?v=1656398822" />
                </div>
            </div>
        </div>
        <div style="display:grid; gap:10px">
            <div class="card">
                <div>
                    <div>
                        <h4>Omada Access Point</h4>
                        <a
                            href="https://store.omadanetworks.com/products/omada-ax3000-ceiling-mount-dual-band-wi-fi-6-access-point">

                            link </a>
                        <p>A wireless access point I can use for continuing my experimentation with networking </p>
                    </div>
                    <img
                        src="https://store.omadanetworks.com/cdn/shop/files/EAP650_EU_3.0_overview_01_large_20260206072215k_e42438e4-512e-4e41-8803-2d636d46f010.jpg?v=1787792172&width=1000" />
                </div>
            </div>
            <div class="card">
                <div>
                    <div>
                        <h4>Wireless Mouse</h4>
                        <a href="www.amazon.com/SteelSeries-Rival-Wireless-Gaming-Mouse/dp/B08GDDZML8">

                            link </a>
                        <p>A new wireless mouse (lost my old one)</p>
                    </div>
                    <img src="https://m.media-amazon.com/images/I/41bgs54v7CL._AC_SX300_SY300_QL70_ML2_.jpg" />
                </div>
            </div>
        </div>
    </div>
</body>

</html>
